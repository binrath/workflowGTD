<header class="site">
  <div class="brand">
    <h1>GTD Workflow</h1>

<main>
  <div class="card">
    <p class="eyebrow">Step 1 · Clarify</p>
    <h2 class="question">Is it actionable?</h2>
    <p class="hint">You've captured something in your "In" tray. Does it require you to do anything?</p>
    <div class="choices">
      <a class="btn" href="yes.html">Yes<span class="sub">it needs action</span></a>
      <a class="btn no" href="no.html">No<span class="sub">no action needed</span></a>
    </div>
  </div>
</main>
<footer class="site">Based on the GTD® workflow diagram by David Allen.</footer>
